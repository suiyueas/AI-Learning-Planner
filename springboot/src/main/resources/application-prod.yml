# ============================================================
# 生产环境配置
# 使用方式: java -jar xxx.jar --spring.profiles.active=prod
#
# Elasticsearch 向量检索为 RAG 默认主存储（ES_VECTORSTORE_ENABLED 默认 true）
# 连接配置继承自 application.yml：
#   ELASTICSEARCH_HOST / ELASTICSEARCH_PORT / ELASTICSEARCH_USERNAME / ELASTICSEARCH_PASSWORD
# ES 不可达时自动降级为内存向量存储 + 关键词搜索，不阻断应用启动
# ============================================================

spring:
  # 生产环境保持与默认一致的向量存储行为（如需要显式关闭 ES，设置 ES_VECTORSTORE_ENABLED=false）

# 应用配置
app:
  init:
    # 生产环境默认关闭默认管理员初始化（自建管理员，或设置 INIT_ADMIN_PASSWORD 强密码后按需开启）
    default-admin-enabled: ${INIT_DEFAULT_ADMIN:false}
