# ============================================================
# AI Learning Planner - Docker Compose 编排
# 一键启动：MySQL + Redis + Elasticsearch + 后端 + 前端
#
# 使用方式：
#   1. cp .env.example .env  并填入 AI API Key / JWT 密钥
#   2. docker compose up -d --build
#   3. 访问前端 http://localhost:3000，后端 http://localhost:8080/api
#
# 说明：${VAR:-默认值} 为 Compose 变量替换，未配置时回退演示默认值；
#       MySQL/Redis 密码与 JWT 密钥等生产环境务必通过 .env 覆盖。
# ============================================================

services:
  # ---------- MySQL（业务数据） ----------
  mysql:
    image: mysql:8.0
    container_name: alp-mysql
    restart: unless-stopped
    environment:
      # 复用 .env 中的 MYSQL_PASSWORD 作为 root 密码，保证后端连接一致
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-alp-dev-2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_learning_planner}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- Redis（缓存/会话/上下文窗口） ----------
  redis:
    image: redis:7-alpine
    container_name: alp-redis
    restart: unless-stopped
    environment:
      # 容器内环境变量：command 与 healthcheck 通过 $$ 引用它
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------- Elasticsearch（RAG 向量检索主存储） ----------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: alp-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # 本地演示关闭安全认证（生产请开启 xpack.security 并配置 ELASTICSEARCH_USERNAME/PASSWORD）
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ---------- 后端（Spring Boot） ----------
  backend:
    build:
      context: ./springboot
    image: ai-learning-planner-backend:1.0.0
    container_name: alp-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      # 中间件容器地址（compose 内部网络）
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_learning_planner}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-alp-dev-2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      # RAG 向量存储：ES 为主存储，不可达时自动降级内存
      ES_VECTORSTORE_ENABLED: ${ES_VECTORSTORE_ENABLED:-true}
      # AI 模型（由 .env 注入）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode}
      MIMO_API_KEY: ${MIMO_API_KEY:-}
      MIMO_BASE_URL: ${MIMO_BASE_URL:-https://api.xiaomimimo.com/v1}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # JWT（演示默认值仅用于本地试用，生产必须通过 .env 覆盖）
      JWT_SECRET: ${JWT_SECRET:-alp-dev-only-jwt-secret-change-me-please-2026-0123456789}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400}
      # 演示环境默认初始化 admin/admin123 账户
      INIT_DEFAULT_ADMIN: ${INIT_DEFAULT_ADMIN:-true}
    ports:
      - "8080:8080"
    volumes:
      - uploads-data:/app/uploads

  # ---------- 前端（Vue 3 + Nginx） ----------
  frontend:
    build:
      context: ./vue
    image: ai-learning-planner-frontend:1.0.0
    container_name: alp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${VUE_PORT:-3000}:80"

volumes:
  mysql-data:
  redis-data:
  es-data:
  uploads-data:
