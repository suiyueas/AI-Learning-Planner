# ============================================================
# AI Learning Planner - Docker Compose 编排
# 一键启动：MySQL + Redis + Elasticsearch + 后端 + 前端
#
# 使用方式：
#   1. cp .env.example .env  并填入 AI API Key / JWT 密钥
#   2. docker compose up -d --build
#   3. 访问前端 http://localhost:3000，后端 http://localhost:8080/api
#
# 已内置生产加固（对开发/演示无副作用，无需额外文件）：
#   - 资源限制：每容器 cpus / mem_limit，防止单容器耗尽宿主机
#   - 日志滚动：json-file 单文件 50MB × 3，自动压缩，防止磁盘打满
#   - 分层网络：net-public（Nginx <-> 后端）/ net-data（后端 <-> 中间件）
#
# 正式上线检查清单：
#   - 删除 mysql / redis / elasticsearch / backend 的 `ports` 映射
#     （保留 frontend 端口），使 Nginx 成为唯一公网入口
#   - .env 覆盖 MYSQL_PASSWORD / REDIS_PASSWORD / JWT_SECRET
#     （文件中为演示默认值，仅用于本地试用）
#   - 开启 Elasticsearch 认证（示例见 elasticsearch 服务内注释）
#   - Linux 主机设置 vm.max_map_count=262144（ES 依赖）
# ============================================================

# 日志滚动统一配置（YAML 锚点复用）
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"
    compress: "true"

services:
  # ---------- MySQL（业务数据） ----------
  mysql:
    image: mysql:8.0
    container_name: alp-mysql
    restart: unless-stopped
    environment:
      # 复用 .env 中的 MYSQL_PASSWORD 作为 root 密码，保证后端连接一致
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_learning_planner}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    # 资源限制：防止单容器耗尽宿主机
    cpus: 1.0
    mem_limit: 1g
    # 日志滚动：单文件 50MB × 3，自动压缩
    logging: *default-logging
    # 开发/演示调试入口；生产部署请删除此映射（仅内部网络 net-data 可达）
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - net-data
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- Redis（缓存/会话/上下文窗口） ----------
  redis:
    image: redis:7-alpine
    container_name: alp-redis
    restart: unless-stopped
    environment:
      # 容器内环境变量：command 与 healthcheck 通过 $$ 引用它
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    cpus: 0.5
    mem_limit: 512m
    logging: *default-logging
    # 开发/演示调试入口；生产部署请删除此映射
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - net-data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------- Elasticsearch（RAG 向量检索主存储） ----------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: alp-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # 演示环境关闭安全认证。
      # 生产建议改为 "true" 并设置 ELASTIC_PASSWORD，
      # 同时在 backend 配置 ELASTICSEARCH_USERNAME=elastic / ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cpus: 1.0
    mem_limit: 1g
    logging: *default-logging
    # 开发/演示调试入口；生产部署请删除此映射
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - net-data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ---------- 后端（Spring Boot） ----------
  backend:
    build:
      context: ./springboot
    image: ai-learning-planner-backend:1.0.0
    container_name: alp-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      # 中间件容器地址（compose 内部网络）
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_learning_planner}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-alp-dev-2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      # RAG 向量存储：ES 为主存储，不可达时自动降级内存
      ES_VECTORSTORE_ENABLED: ${ES_VECTORSTORE_ENABLED:-true}
      # AI 模型（由 .env 注入）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode}
      MIMO_API_KEY: ${MIMO_API_KEY:-}
      MIMO_BASE_URL: ${MIMO_BASE_URL:-https://api.xiaomimimo.com/v1}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # JWT（演示默认值仅用于本地试用，生产必须通过 .env 覆盖）
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400}
      # 演示环境默认初始化 admin/admin123 账户
      INIT_DEFAULT_ADMIN: ${INIT_DEFAULT_ADMIN:-true}
    cpus: 2.0
    mem_limit: 1g
    logging: *default-logging
    # 开发/演示调试入口（Swagger 等）；生产部署请删除此映射，仅经 Nginx 访问
    ports:
      - "8080:8080"
    volumes:
      - uploads-data:/app/uploads
    # 同时接入两个网段：经 net-public 被 Nginx 访问，经 net-data 访问中间件
    networks:
      - net-public
      - net-data

  # ---------- 前端（Vue 3 + Nginx，唯一公网入口） ----------
  frontend:
    build:
      context: ./vue
    image: ai-learning-planner-frontend:1.0.0
    container_name: alp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    cpus: 0.25
    mem_limit: 128m
    logging: *default-logging
    ports:
      - "${VUE_PORT:-3000}:80"
    networks:
      - net-public

networks:
  # 入口网段：Nginx <-> 后端
  net-public:
  # 数据网段：后端 <-> MySQL / Redis / Elasticsearch（中间件仅内部网段可达）
  net-data:

volumes:
  mysql-data:
  redis-data:
  es-data:
  uploads-data: